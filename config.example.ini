[source]
# ストリームURL管理用XMLのURL
target_url = https://example.com/fm
request_timeout = 20
user_agent = radiostream-monitor/1.0

[storage]
database_path = data/radiostream.sqlite3

[notification]
# line-broadcast、line、またはntfy
provider = line-broadcast
# LINE Messaging APIのチャネルアクセストークン
access_token =
# lineの場合のみ使用。line-broadcastでは不要
to =
# ntfyを使う場合の設定
endpoint = https://ntfy.sh
token =
topic = fm-radio
