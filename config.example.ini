[source]
# ストリームURL管理用XMLのURL
target_url = https://www.example.com/fm
request_timeout = 20
user_agent = radiostream-monitor/1.0

[storage]
database_path = data/radiostream.sqlite3

[notification]
# line-broadcast または line または ntfy
provider = line-broadcast
# LINE Messaging APIのチャネルアクセストークン
access_token = 
# Broadcast APIでは使用しない
to =
# ntfyを使う場合の設定
endpoint = https://ntfy.sh
token =
topic = fm-radio
