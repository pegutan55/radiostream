[source]
# ストリームURL管理用XMLのURL
target_url = https://example.com/fm
request_timeout = 20
user_agent = radiostream-monitor/1.0

[storage]
database_path = data/radiostream.sqlite3

[notification]
# ntfy等のHTTP Pushサービスのpublishエンドポイント
endpoint = https://ntfy.sh
# 必要な場合のみ設定
token =
# X-Topicヘッダーとして送信
topic = fm-radio
